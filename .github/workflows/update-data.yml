name: Update price data

on:
  schedule:
    # Runs at 22:30 UTC, Monday to Friday, a bit after the US market close.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest prices
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || git commit -m "Update price data"
          git push
